<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div x-data="kanban()">
    <h1>Kanban</h1>

    <div class="board-tabs">
      <template x-for="board in boards" :key="board.id">
        <button class="board-tab" :class="{ active: currentBoardId == board.id }"
          @click="currentBoardId = board.id; loadCards()" x-text="board.code">
        </button>
      </template>
      <button class="board-tab add-board" @click="showCreateBoardForm = true">+</button>
    </div>

    <div class="board">
      <template x-for="column in currentBoard?.columns || []" :key="column.id">
        <div class="column" :class="{ 'card-drag-over': cardDragOverColumn === column.id }"
          @dragover.prevent="onCardDragOver($event)" @dragenter="onCardDragEnterColumn(column.id, $event)"
          @dragleave="onCardDragLeaveColumn(column.id, $event)" @drop="onCardDropInColumn(column.id, $event)">
          <h2 x-text="column.name"></h2>
          <button @click="showCreateForm = true; newCard.column = column.id" class="add-card-btn">+</button>
          <template x-for="card in cardsForColumn(column.id)" :key="card.id">
            <div class="card" draggable="true" @dragstart="onCardDragStart(card.id, $event)"
              @dragend="onCardDragEnd($event)" @click="selectedCard = card; isEditingCard = false">
              <span class="card-code" x-text="card.code"></span>
              <h3 x-text="card.title"></h3>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Create card modal -->
    <div x-show="showCreateForm" @click.self="showCreateForm = false" class="modal-overlay">
      <div class="modal">
        <h2>New Card</h2>
        <form @submit.prevent="createCard">
          <input type="text" x-model="newCard.title" placeholder="Title" required>
          <textarea x-model="newCard.description" placeholder="Description" rows="4"></textarea>
          <div class="modal-buttons">
            <button type="submit">Create</button>
            <button type="button" @click="showCreateForm = false">Cancel</button>
          </div>
        </form>
      </div>
    </div>


    <!-- Card view modal -->
    <div x-show="selectedCard != null && !isEditingCard" @click.self="selectedCard = null" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 x-text="selectedCard?.title"></h3>
          <div class="modal-timestamps">
            <span x-text="'Created ' + formatTimestamp(selectedCard?.created_at)"></span>
            <span x-text="'Updated ' + formatTimestamp(selectedCard?.updated_at)"></span>
          </div>
        </div>

        <div class="modal-content">
          <p x-text="selectedCard?.description || 'No description'"></p>
        </div>

        <!-- Column selector dropdown -->
        <div class="column-selector">
          <label for="column-select">Move to:</label>
          <select id="column-select" :value="selectedCard?.column" @change="moveCardToColumn($event.target.value)">
            <template x-for="column in currentBoard?.columns || []" :key="column.id">
              <option :value="column.id" x-text="column.name"></option>
            </template>
          </select>
        </div>

        <!-- Board selector dropdown -->
        <div class="column-selector">
          <label for="board-select">Move to board:</label>
          <select id="board-select" :value="selectedCard?.board_id" @change="moveCardToBoard($event.target.value)">
            <template x-for="board in boards" :key="board.id">
              <option :value="board.id" x-text="board.name"></option>
            </template>
          </select>
        </div>

        <div class="modal-buttons">
          <button type="button" @click="startEditingCard()">Edit</button>
          <button type="button" @click="selectedCard = null">Close</button>
        </div>
      </div>
    </div>

    <!-- Card edit modal -->
    <div x-show="selectedCard != null && isEditingCard" @click.self="cancelEditCard(); selectedCard=null"
      class="modal-overlay">
      <div class="modal">
        <form @submit.prevent="updateCard">
          <div class="modal-header">
            <input type="text" x-model="editCard.title" placeholder="Title" required class="modal-title-input">
            <div class="modal-timestamps">
              <span x-text="'Created ' + formatTimestamp(selectedCard?.created_at)"></span>
              <span x-text="'Updated ' + formatTimestamp(selectedCard?.updated_at)"></span>
            </div>
          </div>

          <div class="modal-content">
            <textarea x-model="editCard.description" placeholder="Description" rows="6"></textarea>
          </div>

          <div class="modal-buttons">
            <button type="submit">Save</button>
            <button type="button" @click="cancelEditCard()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div x-show="showCreateBoardForm" @click.self="showCreateBoardForm = false" class="modal-overlay">
      <div class="modal">
        <h2>New Board</h2>
        <form @submit.prevent="createBoard">
          <input type="text" x-model="newBoard.name" placeholder="Board Name" required>
          <input type="text" x-model="newBoard.code" placeholder="Code (e.g., DEV)" required>
          <textarea x-model="newBoard.description" placeholder="Description" rows="3"></textarea>
          <div class="modal-buttons">
            <button type="submit">Create</button>
            <button type="button" @click="showCreateBoardForm = false">Cancel</button>
          </div>
        </form>
      </div>
    </div>



    <script src="/static/dist/bundle.min.js"></script>
</body>

</html>
